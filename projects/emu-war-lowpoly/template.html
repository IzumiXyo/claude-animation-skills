<script type="module">
import * as THREE from "three";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

const SPEC = __SPEC__;
const RW = 360, RH = 640, DUR = Number(document.getElementById('root').dataset.duration);
let seed = 1932;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, k) => a + (b - a) * k;

// ------------------------------------------------------------ renderer
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
renderer.setPixelRatio(1); renderer.setSize(RW, RH, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fb7d6);
scene.fog = new THREE.Fog(0xf0d8a8, 55, 170);
const camera = new THREE.PerspectiveCamera(54, RW / RH, 0.08, 180);

// ------------------------------------------------------------ PS1/N64 shader patch
const SNX = (RW / 2).toFixed(1), SNY = (RH / 2).toFixed(1);
function ps1(m) {
  m.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
      if (gl_Position.w > 0.0) { vec2 sn = vec2(${SNX}, ${SNY});
        gl_Position.xy = floor(gl_Position.xy / gl_Position.w * sn + 0.5) / sn * gl_Position.w; }`);
    sh.fragmentShader = sh.fragmentShader.replace('#include <dithering_fragment>', `#include <dithering_fragment>
      { const float BY[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
        ivec2 q = ivec2(mod(gl_FragCoord.xy, 4.0));
        float th = (BY[q.x + q.y * 4] + 0.5) / 16.0 - 0.5;
        gl_FragColor.rgb = clamp(floor(gl_FragColor.rgb * 31.0 + th + 0.5) / 31.0, 0.0, 1.0); }`);
  };
  m.customProgramCacheKey = () => 'ps1';
  return m;
}
const lam = (o) => ps1(new THREE.MeshLambertMaterial(Object.assign({ flatShading: true }, o)));
const basic = (o) => ps1(new THREE.MeshBasicMaterial(o));

// ------------------------------------------------------------ pixel textures
function tex(w, h, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); g.imageSmoothingEnabled = false; draw(g, w, h);
  const t = new THREE.CanvasTexture(cv);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const rgbOf = (h) => [(h >> 16) & 255, (h >> 8) & 255, h & 255];
const col = (h, k = 1) => { const [r, g, b] = rgbOf(h); return `rgb(${clamp(r * k, 0, 255) | 0},${clamp(g * k, 0, 255) | 0},${clamp(b * k, 0, 255) | 0})`; };
const px = (g, x, y, c, w = 1, h = 1) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
const noise = (g, x0, y0, w, h, base, j) => { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) px(g, x, y, col(base, 1 + (rnd() * 2 - 1) * j)); };
const mixHex = (a, b, k) => { const A = rgbOf(a), B = rgbOf(b); return (Math.round(lerp(A[0], B[0], k)) << 16) | (Math.round(lerp(A[1], B[1], k)) << 8) | Math.round(lerp(A[2], B[2], k)); };
const css = (h) => `rgb(${(h >> 16) & 255},${(h >> 8) & 255},${h & 255})`;

const T = {};
T.ground = tex(32, 32, (g) => {
  noise(g, 0, 0, 32, 32, 0xc9a24e, .07);
  for (let k = 0; k < 80; k++) px(g, rnd() * 32 | 0, rnd() * 32 | 0, col(0xe2c274), 1, 2);
  for (let k = 0; k < 45; k++) px(g, rnd() * 32 | 0, rnd() * 32 | 0, col(0x9c7838), 1, 2);
  for (let y = 0; y < 32; y += 8) px(g, 0, y, col(0xb08a42, .9), 32, 1);
});
T.ground.repeat.set(42, 42);
T.dirt = tex(32, 32, (g) => {
  noise(g, 0, 0, 32, 32, 0x8a6a48, .08);
  for (let k = 0; k < 50; k++) px(g, rnd() * 32 | 0, rnd() * 32 | 0, col(0x6b4f34, .9 + rnd() * .2), 1 + (rnd() * 3 | 0), 1);
  for (let k = 0; k < 22; k++) px(g, rnd() * 32 | 0, rnd() * 32 | 0, col(0xa8875e), 1, 1);
});
T.dirt.repeat.set(22, 2);
T.plaster = tex(32, 32, (g) => {
  noise(g, 0, 0, 32, 32, 0xe0cda8, .04);
  for (let k = 0; k < 14; k++) px(g, rnd() * 32 | 0, rnd() * 32 | 0, col(0xc8b28a), 1 + (rnd() * 2 | 0), 1);
});
T.timber = tex(32, 32, (g) => {
  for (let y = 0; y < 32; y++) { const b = [0x6b4a30, 0x5b3a24, 0x75543a, 0x60402a][(y / 8) | 0]; for (let x = 0; x < 32; x++) px(g, x, y, col(b, .9 + rnd() * .16)); }
  for (let y = 7; y < 32; y += 8) for (let x = 0; x < 32; x++) px(g, x, y, col(0x38251a));
  for (let k = 0; k < 5; k++) px(g, rnd() * 30 | 0, rnd() * 30 | 0, col(0x452c1c), 2, 1);
});
T.roof = tex(32, 32, (g) => {
  for (let y = 0; y < 32; y += 4) {
    for (let x = 0; x < 32; x++) { px(g, x, y, col(0x8a4a32, .82 + rnd() * .3)); px(g, x, y + 1, col(0x6e3524)); px(g, x, y + 2, col(0x94563c, .9)); px(g, x, y + 3, col(0x5e2e20)); }
  }
  for (let k = 0; k < 8; k++) px(g, rnd() * 32 | 0, rnd() * 32 | 0, col(0xb07a4e), 1, 1);
});
T.roof.repeat.set(2, 2);

function skyTex(top, mid, bot) {
  return tex(8, 64, (g) => {
    for (let y = 0; y < 64; y++) {
      const u = y / 63;
      const c = u < 0.55 ? mixHex(top, mid, u / 0.55) : mixHex(mid, bot, (u - 0.55) / 0.45);
      for (let x = 0; x < 8; x++) px(g, x, y, css(c));
    }
  });
}
T.skyDay = skyTex(0x4f8fbf, 0x9ec9dc, 0xf2e2b4);
T.skyGold = skyTex(0x5d7fb0, 0xd8b48c, 0xffd88a);
T.skyDusk = skyTex(0x4a4a78, 0xb06a6a, 0xff9a5a);
T.skySunset = skyTex(0x2e2a55, 0x8a4a6a, 0xff7040);
for (const k of ['skyDay', 'skyGold', 'skyDusk', 'skySunset']) { T[k].wrapS = T[k].wrapT = THREE.ClampToEdgeWrapping; }

T.dust = tex(8, 8, (g) => {
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    const dx = x - 3.5, dy = y - 3.5, r = Math.sqrt(dx * dx + dy * dy);
    if (r < 3.4 && rnd() > r / 5.2) px(g, x, y, `rgba(236,208,152,${(0.5 * (1 - r / 3.8)).toFixed(3)})`);
  }
});

// ------------------------------------------------------------ materials
const L = (o) => lam(o), B = (o) => basic(o);
const MAT = {
  ground: L({ map: T.ground }),
  dirt: L({ map: T.dirt }),
  plaster: L({ map: T.plaster }),
  timber: L({ map: T.timber }),
  roof: L({ map: T.roof, side: THREE.DoubleSide }),
  window: B({ color: 0xffd88a }),
  door: L({ color: 0x5b3a24 }),
  metal: L({ color: 0x6a6f70 }),
  dark: L({ color: 0x24262a }),
  straw: L({ color: 0xd9b45e }),
  bark: L({ color: 0x6b4f34 }),
  leaf: L({ color: 0x7f8f5f }),
  leaf2: L({ color: 0x93a06a }),
  shadow: B({ color: 0x000000, transparent: true, opacity: 0.22, depthWrite: false }),
};
const matCache = new Map();
const lamC = (c) => { if (!matCache.has(c)) matCache.set(c, L({ color: c })); return matCache.get(c); };

// ------------------------------------------------------------ geometry helpers
function box(parent, w, h, d, mat, x, y, z, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.rotation.set(rx, ry, rz); parent.add(m); return m;
}
function plane(parent, w, h, mat, x, y, z, rx = 0, ry = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z); m.rotation.set(rx, ry, 0); parent.add(m); return m;
}
function cyl(parent, rt, rb, h, seg, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z); parent.add(m); return m;
}
function cone(parent, r, h, seg, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, seg), mat);
  m.position.set(x, y, z); parent.add(m); return m;
}
function gableGeo(w, d, h) {
  const hw = w / 2, hd = d / 2;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([
    -hw, 0, -hd, hw, 0, -hd, hw, 0, hd, -hw, 0, hd, 0, h, -hd, 0, h, hd
  ], 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 1, 0, 1, 1, 0, 1, .5, .5, .5, .5], 2));
  g.setIndex([0, 1, 4, 1, 5, 4, 1, 2, 5, 2, 3, 5, 3, 0, 4, 3, 4, 5, 0, 3, 2, 0, 2, 1]);
  g.computeVertexNormals(); return g;
}
function gable(parent, w, d, h, mat, x, y, z) {
  const m = new THREE.Mesh(gableGeo(w, d, h), mat); m.position.set(x, y, z); parent.add(m); return m;
}

// Merge static farm pieces by material (keeps draw calls low on the CI renderer).
function bake(root) {
  root.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(root.matrixWorld).invert();
  const byMat = new Map();
  root.traverse((o) => {
    if (!o.isMesh) return;
    let g = o.geometry.clone().applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld));
    if (g.index) g = g.toNonIndexed();
    for (const name of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(name)) g.deleteAttribute(name);
    g.clearGroups();
    if (!byMat.has(o.material.uuid)) byMat.set(o.material.uuid, { mat: o.material, geos: [] });
    byMat.get(o.material.uuid).geos.push(g);
  });
  const out = [];
  for (const { mat, geos } of byMat.values()) {
    const merged = mergeGeometries(geos, false);
    if (merged) out.push(new THREE.Mesh(merged, mat));
    for (const g of geos) g.dispose();
  }
  for (const child of [...root.children]) root.remove(child);
  for (const m of out) root.add(m);
}

// ------------------------------------------------------------ sky, sun, hills, clouds
const skyGeo = new THREE.PlaneGeometry(420, 230);
const skyMats = [
  new THREE.MeshBasicMaterial({ map: T.skyDay, transparent: true, depthWrite: false, depthTest: true, fog: false, side: THREE.DoubleSide }),
  new THREE.MeshBasicMaterial({ map: T.skyGold, transparent: true, depthWrite: false, depthTest: true, fog: false, side: THREE.DoubleSide }),
  new THREE.MeshBasicMaterial({ map: T.skyDusk, transparent: true, depthWrite: false, depthTest: true, fog: false, side: THREE.DoubleSide }),
  new THREE.MeshBasicMaterial({ map: T.skySunset, transparent: true, depthWrite: false, depthTest: true, fog: false, side: THREE.DoubleSide }),
];
skyMats.forEach((m, i) => { const p = new THREE.Mesh(skyGeo, m); p.position.set(0, 45, -125); p.renderOrder = -40 + i; scene.add(p); });

const sunMat = new THREE.MeshBasicMaterial({ color: 0xfff0c0, fog: false });
const sun = new THREE.Mesh(new THREE.CircleGeometry(8.5, 12), sunMat);
sun.position.set(-26, 24, -118); sun.renderOrder = -25; scene.add(sun);

function hillLayer(z, color, pts) {
  const v = pts.map(([x, y]) => new THREE.Vector2(x, y));
  const m = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(v)), new THREE.MeshBasicMaterial({ color, fog: false }));
  m.position.set(0, 0, z); m.renderOrder = -20; scene.add(m); return m;
}
const hillA = hillLayer(-88, 0x6a7a5e, [[-170, -4], [-140, 8], [-110, 3], [-80, 11], [-50, 4], [-20, 8], [10, 3], [45, 10], [80, 4], [110, 7], [145, 2], [170, -4]]);
const hillB = hillLayer(-72, 0x7d8a62, [[-170, -4], [-135, 5], [-100, 2], [-65, 7], [-30, 3], [5, 6], [40, 2], [75, 7], [110, 3], [150, 5], [170, -4]]);

const cloudMat = B({ color: 0xf4ead2, fog: false });
const cloudGeo = new THREE.IcosahedronGeometry(1, 0);
const clouds = [];
for (let i = 0; i < 6; i++) {
  const g = new THREE.Group();
  for (let k = 0; k < 3; k++) {
    const m = new THREE.Mesh(cloudGeo, cloudMat);
    m.position.set((k - 1) * 3.2 + rnd() * 1.2, rnd() * 1.1, rnd() * 1.4);
    m.scale.set(3.2 + rnd() * 2.2, 0.8 + rnd() * 0.5, 1.7 + rnd() * 0.8);
    g.add(m);
  }
  g.position.set(-45 + i * 18, 22 + rnd() * 9, -58 - rnd() * 10);
  g.userData.base = g.position.x;
  scene.add(g); clouds.push(g);
}

// ------------------------------------------------------------ static farm world
const staticRoot = new THREE.Group(); scene.add(staticRoot);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), MAT.ground);
ground.rotation.x = -Math.PI / 2; staticRoot.add(ground);

const road = new THREE.Mesh(new THREE.PlaneGeometry(92, 7), MAT.dirt);
road.rotation.x = -Math.PI / 2; road.position.set(0, 0.02, 9); staticRoot.add(road);

const path = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 23), MAT.dirt);
path.rotation.x = -Math.PI / 2; path.position.set(-11, 0.025, -2.5); staticRoot.add(path);

// fence line, with a gate by the path and a broken stretch where the emus came through
for (let x = -33; x <= 33; x += 3) {
  if (x > -13.5 && x < -7.5) continue;
  const post = box(staticRoot, 0.16, 1.15, 0.16, MAT.timber, x, 0.575, -5);
  if (x >= 0 && x <= 3) { post.rotation.z = 0.24; post.position.y = 0.52; }
  if (x > -3 && x < 0) { post.rotation.z = -0.38; post.position.y = 0.46; }
}
for (let x = -33; x <= 30; x += 3) {
  if (x + 1.5 > -13.5 && x + 1.5 < -7.5) continue;
  if (x > -3 && x < 3) continue;
  box(staticRoot, 3, 0.08, 0.08, MAT.timber, x + 1.5, 0.5, -5);
  box(staticRoot, 3, 0.08, 0.08, MAT.timber, x + 1.5, 0.9, -5);
}
box(staticRoot, 2.2, 0.08, 0.08, MAT.timber, 1.2, 0.12, -4.2, 0, 0.35, 0.12);
box(staticRoot, 1.7, 0.08, 0.08, MAT.timber, 3.1, 0.1, -4.8, 0, -0.5, -0.08);

// homestead
const HX = -14, HZ = -18;
box(staticRoot, 7, 3.2, 5, MAT.plaster, HX, 1.6, HZ);
gable(staticRoot, 7.8, 5.8, 2.1, MAT.roof, HX, 3.2, HZ);
box(staticRoot, 7.6, 0.18, 1.6, MAT.timber, HX, 2.55, HZ + 3.25);
box(staticRoot, 7.6, 0.15, 1.6, MAT.timber, HX, 0.2, HZ + 3.25);
for (const dx of [-3.45, -1.2, 1.2, 3.45]) box(staticRoot, 0.12, 2.4, 0.12, MAT.timber, HX + dx, 1.3, HZ + 3.95);
box(staticRoot, 0.85, 1.9, 0.1, MAT.door, HX, 1.05, HZ + 2.52);
for (const dx of [-2.3, 2.3]) {
  box(staticRoot, 1.15, 0.95, 0.08, MAT.window, HX + dx, 1.95, HZ + 2.52);
  box(staticRoot, 1.3, 0.1, 0.12, MAT.timber, HX + dx, 2.47, HZ + 2.54);
}
box(staticRoot, 0.7, 1.9, 0.7, MAT.plaster, HX - 2.5, 4.15, HZ - 1.1);
box(staticRoot, 0.82, 0.14, 0.82, MAT.timber, HX - 2.5, 5.15, HZ - 1.1);

// water tank on a stand
for (const [dx, dz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) box(staticRoot, 0.1, 1.3, 0.1, MAT.timber, -8.8 + dx, 0.65, -17.5 + dz);
cyl(staticRoot, 1.1, 1.1, 2.1, 8, MAT.metal, -8.8, 2.3, -17.5);
cone(staticRoot, 1.12, 0.5, 8, MAT.metal, -8.8, 3.6, -17.5);

// windmill tower (the fan is animated separately)
for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
  const leg = box(staticRoot, 0.14, 6.6, 0.14, MAT.timber, -6 + sx * 0.95, 3.3, -13 + sz * 0.95);
  leg.rotation.z = -sx * 0.09; leg.rotation.x = sz * 0.09;
}
for (const y of [2.2, 4.4, 6.2]) {
  box(staticRoot, 1.7, 0.08, 0.08, MAT.timber, -6, y, -13 - 0.85);
  box(staticRoot, 1.7, 0.08, 0.08, MAT.timber, -6, y, -13 + 0.85);
  box(staticRoot, 0.08, 0.08, 1.7, MAT.timber, -6 - 0.85, y, -13);
  box(staticRoot, 0.08, 0.08, 1.7, MAT.timber, -6 + 0.85, y, -13);
}
box(staticRoot, 1.8, 0.12, 1.8, MAT.timber, -6, 6.55, -13);

function emuPose(p, t, mode) {
  const sp = mode === 'run' ? 10.5 : mode === 'walk' ? 5.2 : 1.35;
  const s = Math.sin(t * sp + p.ph);
  if (mode === 'run') {
    p.body.position.y = 1.05 + Math.abs(s) * 0.06;
    p.body.rotation.x = 0.2;
    p.legL.rotation.x = s * 1.05; p.legR.rotation.x = -s * 1.05;
    p.neck.rotation.x = 0.55 + Math.sin(t * 5 + p.ph) * 0.05;
    p.head.rotation.x = -0.28;
    p.tail.rotation.x = 0.2;
    p.body.rotation.z = Math.sin(t * 5.2 + p.ph) * 0.04;
  } else if (mode === 'walk') {
    p.body.position.y = 1.05 + Math.abs(s) * 0.035;
    p.body.rotation.x = 0.04;
    p.legL.rotation.x = s * 0.5; p.legR.rotation.x = -s * 0.5;
    p.neck.rotation.x = 0.32 + Math.sin(t * 2.2 + p.ph) * 0.09;
    p.head.rotation.x = -0.06 + Math.sin(t * 1.9 + p.ph) * 0.1;
    p.tail.rotation.x = 0.5;
    p.body.rotation.z = 0;
  } else {
    const peck = Math.max(0, Math.sin(t * 0.52 + p.ph) - 0.9) / 0.1;
    p.body.position.y = 1.05 + Math.sin(t * 1.3 + p.ph) * 0.012;
    p.body.rotation.x = 0;
    p.legL.rotation.x = 0; p.legR.rotation.x = 0;
    p.neck.rotation.x = 0.35 + peck * 1.15;
    p.head.rotation.x = -peck * 0.6 + Math.sin(t * 0.8 + p.ph) * 0.05;
    p.head.rotation.z = Math.sin(t * 0.6 + p.ph) * 0.12;
    p.tail.rotation.x = 0.5 + Math.sin(t * 1.1 + p.ph) * 0.08;
    p.body.rotation.z = 0;
  }
}

function updateFlock(t) {
  for (let i = 0; i < flock.length; i++) {
    const p = flock[i];
    let x = p.home.x, z = p.home.y, mode = 'idle', ry = p.face;
    if (t < 8.96) {
      x += Math.sin(t * 0.18 + p.ph) * 0.7; z += Math.cos(t * 0.15 + p.ph) * 0.5;
      if (p.walkBias > 0.55) mode = 'walk';
    } else if (t < 25.6) {
      x += Math.sin(t * 0.16 + p.ph) * 1.25; z += Math.cos(t * 0.13 + p.ph * 1.3) * 0.85;
      if (p.walkBias > 0.42) mode = 'walk';
    } else if (t < 33.4) {
      mode = 'idle';
    } else if (t < 51.5) {
      const tc = t - 33.4;
      x = p.home.x + Math.sin(tc * 0.55 + p.ph) * 5.5;
      z = p.home.y + Math.cos(tc * 0.45 + p.ph * 1.7) * 3.5;
      mode = 'run';
      const dx = Math.cos(tc * 0.55 + p.ph) * 5.5 * 0.55;
      const dz = -Math.sin(tc * 0.45 + p.ph * 1.7) * 3.5 * 0.45;
      ry = Math.atan2(dx, dz);
    } else {
      const tc = 18.1;
      x = p.home.x + Math.sin(tc * 0.55 + p.ph) * 5.5;
      z = p.home.y + Math.cos(tc * 0.45 + p.ph * 1.7) * 3.5;
      mode = 'idle';
      if (t > 60.1 && p.walkBias > 0.62) { x += Math.sin(t * 0.22 + p.ph) * 0.9; mode = 'walk'; }
    }
    x = clamp(x, -27, 27); z = clamp(z, -20, 5.2);
    p.root.position.set(x, 0, z);
    if (mode !== 'run') ry = p.face + Math.sin(t * 0.12 + p.ph) * 0.5;
    p.root.rotation.y = ry;
    emuPose(p, t, mode);
    p.root.updateMatrixWorld(true);
    EM.body.setMatrixAt(i, p.bodyM.matrixWorld);
    EM.neck.setMatrixAt(i, p.neckM.matrixWorld);
    EM.head.setMatrixAt(i, p.headM.matrixWorld);
    EM.beak.setMatrixAt(i, p.beakM.matrixWorld);
    EM.tail.setMatrixAt(i, p.tailM.matrixWorld);
    EM.legL.setMatrixAt(i, p.legLM.matrixWorld);
    EM.legR.setMatrixAt(i, p.legRM.matrixWorld);
    EM.shadow.setMatrixAt(i, p.shadowM.matrixWorld);
  }
  for (const m of EMU_MESHES) m.instanceMatrix.needsUpdate = true;
}

function strut(parent, ax, ay, az, bx, by, bz, r, mat) {
  const a = new THREE.Vector3(ax, ay, az), b = new THREE.Vector3(bx, by, bz);
  const dir = new THREE.Vector3().subVectors(b, a), len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 4), mat);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  parent.add(m); return m;
}

const CAPS = SPEC.caps || [];
const capEl = document.getElementById('cap'), tagEl = document.getElementById('tag'), fadeEl = document.getElementById('fade');
const statEl = document.getElementById('stat'), statKick = document.getElementById('statKick');
const statNum = document.getElementById('statNum'), statLbl = document.getElementById('statLbl');
const titleEl = document.getElementById('title'), titleKick = document.getElementById('titleKick');
const titleH1 = document.getElementById('titleH1'), titleRule = document.getElementById('titleRule'), titleP = document.getElementById('titleP');
let lastCap = -1, lastStat = '';

function updateOverlay(t) {
  let idx = -1;
  for (let i = 0; i < CAPS.length; i++) if (t >= CAPS[i].t0 - 0.12 && t < CAPS[i].t1 + 0.12) idx = i;
  if (idx !== lastCap) {
    capEl.innerHTML = idx >= 0 ? CAPS[idx].text : '';
    if (idx >= 0) {
      const len = CAPS[idx].text.replace(/<br>/g, '').length;
      capEl.style.fontSize = CAPS[idx].size || (len > 44 ? '42px' : len > 34 ? '44px' : '48px');
    }
    lastCap = idx;
  }
  if (idx >= 0) {
    const c = CAPS[idx];
    const a = smooth(c.t0 - 0.08, c.t0 + 0.12, t) * (1 - smooth(c.t1 - 0.12, c.t1 + 0.04, t));
    capEl.style.opacity = a.toFixed(3);
    capEl.style.visibility = a > 0.01 ? 'visible' : 'hidden';
  } else {
    capEl.style.opacity = '0'; capEl.style.visibility = 'hidden';
  }

  tagEl.style.opacity = (smooth(0.35, 0.8, t) * (1 - smooth(4.8, 5.4, t))).toFixed(3);

  const statOn = t >= 56.0 && t < 60.15;
  if (statOn) {
    const second = t >= 58.25;
    const tag = second ? 'AMUNISI DIKERAHKAN' : 'OPERATION 1';
    if (lastStat !== tag) {
      lastStat = tag;
      statKick.textContent = tag;
      statNum.textContent = second ? '10,000' : '30';
      statNum.style.fontSize = second ? '168px' : '210px';
      statLbl.textContent = second ? 'ROUNDS' : 'EMUS';
    }
    const a = smooth(56.0, 56.3, t) * (1 - smooth(59.9, 60.15, t));
    const pop = second ? smooth(58.25, 58.55, t) : smooth(56.0, 56.4, t);
    statEl.style.opacity = a.toFixed(3);
    statEl.style.visibility = a > 0.01 ? 'visible' : 'hidden';
    statEl.style.transform = `translateY(${(1 - pop) * 18}px) scale(${0.94 + pop * 0.06})`;
  } else {
    statEl.style.opacity = '0'; statEl.style.visibility = 'hidden';
  }

  const titleOn = t >= 68.30;
  titleEl.style.visibility = titleOn ? 'visible' : 'hidden';
  titleEl.style.opacity = titleOn ? smooth(68.3, 69.2, t).toFixed(3) : '0';
  titleKick.style.opacity = smooth(68.4, 69.3, t).toFixed(3);
  const h1 = smooth(70.85, 71.7, t);
  titleH1.style.opacity = h1.toFixed(3);
  titleH1.style.transform = `translateY(${(1 - h1) * 20}px)`;
  titleRule.style.opacity = h1.toFixed(3);
  titleP.style.opacity = smooth(73.1, 73.9, t).toFixed(3);

  const fadeIn = 1 - smooth(0.0, 0.5, t);
  const fadeOut = smooth(78.6, 79.8, t);
  fadeEl.style.opacity = Math.max(fadeIn, fadeOut).toFixed(3);
}

// ------------------------------------------------------------ animation
function walkPerson(p, t, speed) {
  const s = Math.sin(t * 6.4 * speed + p.phase);
  p.legL.rotation.x = s * 0.5; p.legR.rotation.x = -s * 0.5;
  p.armL.rotation.x = -s * 0.4; p.armR.rotation.x = s * 0.4;
  p.armL.rotation.z = 0.08; p.armR.rotation.z = -0.08;
  p.body.position.y = Math.abs(s) * 0.035;
  p.body.rotation.z = 0; p.head.rotation.set(0, 0, 0);
}
function resetPerson(p) {
  p.root.position.y = 0;
  p.body.position.y = 0; p.body.rotation.set(0, 0, 0);
  p.armL.rotation.set(0, 0, 0.08); p.armR.rotation.set(0, 0, -0.08);
  p.legL.rotation.x = 0; p.legR.rotation.x = 0;
  p.head.rotation.set(0, 0, 0);
}

function updateFarmers(t) {
  const on = t >= 8.9 && t < 26.1;
  farmer1.root.visible = on; farmer2.root.visible = on;
  if (!on) return;
  for (const f of [farmer1, farmer2]) { resetPerson(f); f.body.position.y = Math.sin(t * 1.3 + f.phase) * 0.008; }
  const wave = smooth(14.2, 15.0, t) * (1 - smooth(19.6, 20.4, t));
  farmer1.armR.rotation.z = -0.2 - wave * 2.0;
  farmer1.armR.rotation.x = -0.2 - wave * 0.35 + Math.sin(t * 9) * wave * 0.18;
  const point = smooth(20.3, 21.2, t) * (1 - smooth(25.4, 26.0, t));
  farmer2.armR.rotation.x = -point * 1.45;
  farmer2.armR.rotation.z = -0.1;
  farmer1.head.rotation.z = Math.sin(t * 0.9) * 0.08;
}

function updateSoldiers(t) {
  const on = t >= 26.4 && t < 64.6;
  for (const s of soldiers) s.root.visible = on;
  if (!on) return;
  for (const s of soldiers) resetPerson(s);
  ammoBox.visible = (t >= 26.4 && t < 33.6) || (t >= 60.5 && t < 63.6);

  const gunSpots = [[6.5, 7.75], [7.8, 7.15], [8.9, 7.8]];
  const dropSpots = [[10.4, 8.0], [11.6, 8.5], [12.4, 8.8]];
  const restSpots = [[5.6, 6.7], [7.7, 6.4], [8.8, 7.1]];
  const truckSpots = [[12.3, 8.1], [13.2, 8.35], [14.0, 8.6]];

  if (t < 30.5) {
    const k = smooth(27.0, 30.4, t);
    soldiers.forEach((s, i) => {
      s.root.position.set(lerp(dropSpots[i][0], gunSpots[i][0], k), 0, lerp(dropSpots[i][1], gunSpots[i][1], k));
      s.root.rotation.y = Math.PI;
      walkPerson(s, t, 1.0);
      if (k >= 1) resetPerson(s);
    });
    return;
  }

  if (t < 60.5) {
    soldiers.forEach((s, i) => { s.root.position.set(gunSpots[i][0], 0, gunSpots[i][1]); s.root.rotation.y = Math.PI; });
    if (t < 37.0) {
      gunner.root.position.y = -0.3; gunner.body.position.y = -0.08; gunner.legL.rotation.x = -1.0; gunner.legR.rotation.x = -1.0;
      gunner.armL.rotation.x = -1.15; gunner.armR.rotation.x = -1.15; gunner.head.rotation.x = 0.12;
      loader.root.position.y = -0.22; loader.legL.rotation.x = -0.7; loader.legR.rotation.x = -0.7;
      loader.armL.rotation.x = -1.0; loader.armR.rotation.x = -1.0;
      const point = smooth(30.6, 31.4, t) * (1 - smooth(36.2, 37.0, t));
      sergeant.armR.rotation.x = -point * 1.5;
      sergeant.armR.rotation.z = -0.15;
      sergeant.head.rotation.x = -point * 0.1;
    } else if (t < 45.0) {
      gunner.root.position.y = -0.24; gunner.body.rotation.x = 0.12;
      gunner.legL.rotation.x = -0.9; gunner.legR.rotation.x = -0.9;
      gunner.armL.rotation.x = -1.3; gunner.armR.rotation.x = -1.3;
      gunner.armL.rotation.z = 0.12; gunner.armR.rotation.z = -0.12;
      gunner.head.rotation.x = 0.1;
      loader.root.position.y = -0.34; loader.legL.rotation.x = -1.1; loader.legR.rotation.x = -1.1;
      loader.armL.rotation.x = -1.1; loader.armR.rotation.x = -1.1;
      sergeant.armL.rotation.x = -2.3; sergeant.armR.rotation.x = -2.3;
      sergeant.armL.rotation.z = 0.55; sergeant.armR.rotation.z = -0.55;
      sergeant.body.rotation.x = 0.08;
    } else if (t < 48.2) {
      gunner.root.position.y = -0.2; gunner.body.rotation.x = 0.1;
      gunner.legL.rotation.x = -0.8; gunner.legR.rotation.x = -0.8;
      gunner.armL.rotation.x = -1.0;
      gunner.armR.rotation.x = -1.0 + Math.max(0, Math.sin(t * 13)) * 0.7;
      gunner.head.rotation.x = 0.16;
      loader.root.position.y = -0.3; loader.legL.rotation.x = -1.0; loader.legR.rotation.x = -1.0;
      loader.armL.rotation.x = -1.3; loader.armR.rotation.x = -1.3;
      sergeant.armL.rotation.x = -2.1; sergeant.armR.rotation.x = -2.1;
      sergeant.armL.rotation.z = 0.5; sergeant.armR.rotation.z = -0.5;
    } else if (t < 52.0) {
      const k = smooth(48.2, 49.2, t);
      soldiers.forEach((s, i) => { s.root.position.z = gunSpots[i][1] + k * 0.9; });
      gunner.armL.rotation.x = -0.4; gunner.armR.rotation.x = -0.4;
      loader.armL.rotation.x = -0.3; loader.armR.rotation.x = -0.3;
      sergeant.armR.rotation.x = -0.8;
      sergeant.head.rotation.z = 0.12;
    } else {
      soldiers.forEach((s, i) => { s.root.position.set(restSpots[i][0], -0.42, restSpots[i][1]); });
      for (const s of soldiers) {
        s.body.position.y = -0.12; s.legL.rotation.x = -1.45; s.legR.rotation.x = -1.45;
        s.armL.rotation.x = 0.15; s.armR.rotation.x = 0.15;
        s.head.rotation.x = 0.32;
      }
      sergeant.head.rotation.x = 0.45;
      gunner.head.rotation.x = 0.5;
    }
    return;
  }

  if (t < 63.5) {
    const k = smooth(60.6, 63.4, t);
    soldiers.forEach((s, i) => {
      s.root.position.set(lerp(gunSpots[i][0], truckSpots[i][0], k), 0, lerp(gunSpots[i][1], truckSpots[i][1], k));
      s.root.rotation.y = Math.PI / 2;
      walkPerson(s, t, 1.0);
    });
    return;
  }

  soldiers.forEach((s, i) => {
    s.root.position.set(truckSpots[i][0], 0, truckSpots[i][1]);
    s.root.rotation.y = Math.PI / 2;
    s.body.position.y = Math.sin(t * 1.4 + i) * 0.008;
  });
}

function updateGun(t) {
  gun.visible = t >= 26.0;
  if (!gun.visible) return;
  const firing = t >= 40.55 && t < 44.95;
  const burst = firing && (Math.floor((t - 40.55) * 7) % 3 !== 2);
  flash.visible = burst;
  if (burst) flash.scale.setScalar(0.85 + rnd() * 0.35);
  gun.position.z = 6.5 + (burst ? 0.05 : 0);
  pan.rotation.y = firing ? t * 4.0 : 0;
  smoke.forEach((s, i) => {
    s.visible = firing;
    if (firing) {
      const ph = (t * 1.3 + i * 0.33) % 1;
      s.position.set(0, 1.05 + ph * 0.55, 1.2 + ph * 0.8);
      s.scale.setScalar(0.7 + ph * 1.6);
    }
  });
  panDown.visible = t > 46.3;

  gun.updateMatrixWorld(true);
  const muzzle = gun.localToWorld(new THREE.Vector3(0, 1.0, 1.16));
  for (let i = 0; i < tracers.length; i++) {
    const tr = tracers[i];
    tr.visible = burst;
    if (!burst) continue;
    const target = new THREE.Vector3(muzzle.x + Math.sin(t * 9 + i * 2.3) * 6.0, 0.18, muzzle.z - 8 - i * 3.2);
    const dir = new THREE.Vector3().subVectors(target, muzzle);
    const len = dir.length(); dir.normalize();
    tr.position.copy(muzzle).addScaledVector(dir, len * 0.55);
    tr.quaternion.setFromUnitVectors(UP, dir);
    tr.scale.set(1, len * 0.5 / 3, 1);
  }
  for (let i = 0; i < impacts.length; i++) {
    const im = impacts[i];
    im.visible = burst;
    if (!burst) continue;
    im.position.set(muzzle.x + Math.sin(t * 9 + i * 2.3) * 6.0, 0.12, muzzle.z - 8 - i * 3.2);
    const ph = ((t * 6 + i * 0.3) % 1);
    im.scale.setScalar(0.5 + ph * 1.6);
    im.material.opacity = 0.55 * (1 - ph);
  }
}

function updateTruck(t) {
  const on = t >= 26.1 && t < 68.2;
  truck.visible = on;
  if (!on) return;
  let x;
  if (t < 64.5) x = lerp(-6, 13, smooth(26.1, 30.5, t));
  else x = lerp(13, 42, smooth(64.5, 68.1, t));
  truck.position.x = x;
  truck.position.y = Math.abs(Math.sin(t * 16)) * 0.018;
  for (const w of wheels) w.rotation.z = -x / 0.55;
}

function updateDust(t) {
  const chaos = t > 37.0 && t < 51.5;
  const truckMoving = (t > 26.1 && t < 30.5) || (t > 64.5 && t < 68.1);
  for (let i = 0; i < DUST_N; i++) {
    let x, z, y;
    if (truckMoving) {
      x = truck.position.x - 2.0 + Math.sin(i * 2.1 + t * 3.0) * 1.3;
      z = 7.5 + Math.cos(i * 1.7) * 1.1;
      y = 0.15 + Math.abs(Math.sin(t * 4 + i)) * 0.55;
    } else if (chaos) {
      const e = flock[i % flock.length];
      x = e.root.position.x + Math.sin(t * 3 + i) * 0.75;
      z = e.root.position.z + Math.cos(t * 2.7 + i) * 0.75;
      y = 0.1 + Math.abs(Math.sin(t * 5 + i)) * 0.4;
    } else {
      x = Math.sin(i * 1.7 + t * 0.15) * 18;
      z = -14 + Math.cos(i * 1.3 + t * 0.1) * 10;
      y = 0.2 + Math.abs(Math.sin(t * 0.9 + i)) * 0.55;
    }
    dustPos[i * 3] = x; dustPos[i * 3 + 1] = y; dustPos[i * 3 + 2] = z;
  }
  dustGeo.attributes.position.needsUpdate = true;
}

// ------------------------------------------------------------ time of day
const C = {
  horizonDay: new THREE.Color(0xf2e2b4), horizonGold: new THREE.Color(0xffd88a),
  horizonDusk: new THREE.Color(0xff9a5a), horizonSun: new THREE.Color(0xff7040),
  sunDay: new THREE.Color(0xfff0c0), sunGold: new THREE.Color(0xffd070),
  sunDusk: new THREE.Color(0xff8a50), sunSet: new THREE.Color(0xff6030),
  keyDay: new THREE.Color(0xfff0d0), keyGold: new THREE.Color(0xffd090),
  keyDusk: new THREE.Color(0xff9060), keySet: new THREE.Color(0xff7040),
  hillDay: new THREE.Color(0x6a7a5e), hillGold: new THREE.Color(0x7a7452),
  hillDusk: new THREE.Color(0x6a4a4a), hillSet: new THREE.Color(0x4a3048),
  hill2Day: new THREE.Color(0x7d8a62), hill2Gold: new THREE.Color(0x8a8258),
  hill2Dusk: new THREE.Color(0x7a5a52), hill2Set: new THREE.Color(0x5a3a50),
  cloudDay: new THREE.Color(0xf4ead2), cloudGold: new THREE.Color(0xffd8a0),
  cloudDusk: new THREE.Color(0xffb080), cloudSet: new THREE.Color(0xff8a70),
};
const horizon = new THREE.Color();
function updateSky(t) {
  const k1 = smooth(24.5, 27.0, t), k2 = smooth(50.5, 53.0, t), k3 = smooth(66.5, 69.0, t);
  skyMats[0].opacity = 1 - k1;
  skyMats[1].opacity = k1 * (1 - k2);
  skyMats[2].opacity = k2 * (1 - k3);
  skyMats[3].opacity = k3;

  horizon.copy(C.horizonDay).lerp(C.horizonGold, k1).lerp(C.horizonDusk, k2).lerp(C.horizonSun, k3);
  scene.fog.color.copy(horizon);
  scene.background.copy(horizon);
  sun.material.color.copy(C.sunDay).lerp(C.sunGold, k1).lerp(C.sunDusk, k2).lerp(C.sunSet, k3);
  sun.position.y = 24 - 4 * k1 - 6 * k2 - 4 * k3;
  key.color.copy(C.keyDay).lerp(C.keyGold, k1).lerp(C.keyDusk, k2).lerp(C.keySet, k3);
  key.intensity = 1.25 + 0.1 * k1 - 0.32 * k2 - 0.16 * k3;
  key.position.y = 12 - 3 * k1 - 5 * k2 - 1 * k3;
  hemi.intensity = 0.95 - 0.08 * k1 - 0.2 * k2 - 0.1 * k3;
  fill.intensity = 0.4 - 0.04 * k1 - 0.1 * k2;
  cloudMat.color.copy(C.cloudDay).lerp(C.cloudGold, k1).lerp(C.cloudDusk, k2).lerp(C.cloudSet, k3);
  hillA.material.color.copy(C.hillDay).lerp(C.hillGold, k1).lerp(C.hillDusk, k2).lerp(C.hillSet, k3);
  hillB.material.color.copy(C.hill2Day).lerp(C.hill2Gold, k1).lerp(C.hill2Dusk, k2).lerp(C.hill2Set, k3);
}

// ------------------------------------------------------------ camera
const camPos = new THREE.Vector3(), camA = new THREE.Vector3(), camB = new THREE.Vector3(), look = new THREE.Vector3();
function updateCamera(t) {
  let s = SHOTS[SHOTS.length - 1];
  for (const q of SHOTS) if (t >= q.t0 && t < q.t1) { s = q; break; }
  const k = smooth(s.t0, s.t1, t);
  camA.set(s.p0[0], s.p0[1], s.p0[2]); camB.set(s.p1[0], s.p1[1], s.p1[2]);
  camPos.lerpVectors(camA, camB, k);
  const shk = s.shake || 0;
  camPos.x += (Math.sin(t * 13.7) + Math.sin(t * 7.3) * 0.6) * 0.014 * shk;
  camPos.y += (Math.sin(t * 11.1) + Math.sin(t * 5.9) * 0.5) * 0.012 * shk;
  camera.position.copy(camPos);
  look.set(lerp(s.look0[0], s.look1[0], k), lerp(s.look0[1], s.look1[1], k), lerp(s.look0[2], s.look1[2], k));
  look.x += Math.sin(t * 9.1) * 0.013 * shk;
  camera.lookAt(look);
  camera.fov = lerp(s.fov0, s.fov1, k);
  camera.updateProjectionMatrix();
}

// ------------------------------------------------------------ main render
function renderAt(t) {
  updateSky(t);
  updateCamera(t);
  updateWheat(t);
  updateFlock(t);
  updateHero(t);
  updateFarmers(t);
  updateSoldiers(t);
  updateGun(t);
  updateTruck(t);
  updateDust(t);

  fan.rotation.z = -t * 1.35;
  for (const g of clouds) g.position.x = ((g.userData.base + t * 0.22 + 60) % 120) - 60;
  for (const g of birds) {
    const a = t * 0.12 + g.userData.ph;
    g.position.x = Math.sin(a) * 24;
    g.position.z = -34 + Math.cos(a * 1.3) * 8;
    g.rotation.y = -a + Math.PI / 2;
    const flap = Math.sin(t * 3.2 + g.userData.ph) * 0.5;
    g.userData.l.rotation.z = flap; g.userData.r.rotation.z = -flap;
  }

  updateOverlay(t);
  renderer.render(scene, camera);
}
window.addEventListener('hf-seek', (e) => renderAt(e.detail.time));
renderAt(window.__hfThreeTime || 0);
</script>
