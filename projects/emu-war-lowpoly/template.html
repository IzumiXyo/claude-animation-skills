<script type="module">
import * as THREE from "three";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

const SPEC = __SPEC__;
const RW = 360, RH = 640, DUR = Number(document.getElementById('root').dataset.duration);
let seed = 1932;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, k) => a + (b - a) * k;
const TAU = Math.PI * 2;

// ------------------------------------------------------------ renderer
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
renderer.setPixelRatio(1); renderer.setSize(RW, RH, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const BG = 0x8fb7d6;
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(0xf0d8a8, 38, 128);
const camera = new THREE.PerspectiveCamera(52, RW / RH, 0.08, 220);

// ------------------------------------------------------------ PS1/N64 shader patch: vertex snap + 15-bit dither
const SNX = (RW / 2).toFixed(1), SNY = (RH / 2).toFixed(1);
function ps1(m) {
  m.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
      if (gl_Position.w > 0.0) { vec2 sn = vec2(${SNX}, ${SNY});
        gl_Position.xy = floor(gl_Position.xy / gl_Position.w * sn + 0.5) / sn * gl_Position.w; }`);
    sh.fragmentShader = sh.fragmentShader.replace('#include <dithering_fragment>', `#include <dithering_fragment>
      { const float BY[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
        ivec2 q = ivec2(mod(gl_FragCoord.xy, 4.0));
        float th = (BY[q.x + q.y * 4] + 0.5) / 16.0 - 0.5;
        gl_FragColor.rgb = clamp(floor(gl_FragColor.rgb * 31.0 + th + 0.5) / 31.0, 0.0, 1.0); }`);
  };
  m.customProgramCacheKey = () => 'ps1';
  return m;
}
const lam = (o) => ps1(new THREE.MeshLambertMaterial(Object.assign({ flatShading: true }, o)));
const basic = (o) => ps1(new THREE.MeshBasicMaterial(o));

// ------------------------------------------------------------ pixel textures
function tex(w, h, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); g.imageSmoothingEnabled = false; draw(g, w, h);
  const t = new THREE.CanvasTexture(cv);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const rgbOf = (h) => [(h >> 16) & 255, (h >> 8) & 255, h & 255];
const col = (h, k = 1) => { const [r, g, b] = rgbOf(h); return `rgb(${clamp(r * k, 0, 255) | 0},${clamp(g * k, 0, 255) | 0},${clamp(b * k, 0, 255) | 0})`; };
const px = (g, x, y, c, w = 1, h = 1) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
const noise = (g, x0, y0, w, h, base, j) => { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) px(g, x, y, col(base, 1 + (rnd() * 2 - 1) * j)); };
const mixHex = (a, b, k) => {
  const A = rgbOf(a), B = rgbOf(b);
  return `rgb(${(A[0] + (B[0] - A[0]) * k) | 0},${(A[1] + (B[1] - A[1]) * k) | 0},${(A[2] + (B[2] - A[2]) * k) | 0})`;
};

const T = {};
T.ground = tex(32, 32, (g) => {
  noise(g, 0, 0, 32, 32, 0xc39a4b, .07);
  for (let k = 0; k < 150; k++) {
    const x = rnd() * 32 | 0, y = rnd() * 32 | 0, h = 2 + (rnd() * 4 | 0);
    px(g, x, y, col(rnd() < .5 ? 0xddb761 : 0xa87c34, .9 + rnd() * .2), 1, h);
  }
  for (let k = 0; k < 8; k++) px(g, rnd() * 30 | 0, rnd() * 30 | 0, col(0x8f6a2c), 2, 1);
});
T.dirt = tex(32, 32, (g) => {
  noise(g, 0, 0, 32, 32, 0x9a7a52, .09);
  for (let k = 0; k < 50; k++) px(g, rnd() * 32 | 0, rnd() * 32 | 0, col(0x7a5c3c, .9 + rnd() * .2), 1 + (rnd() * 3 | 0), 1);
  for (let k = 0; k < 16; k++) px(g, rnd() * 32 | 0, rnd() * 32 | 0, col(0xb59466), 1, 1);
});
T.plaster = tex(32, 32, (g) => {
  noise(g, 0, 0, 32, 32, 0xd8c6a3, .045);
  for (let k = 0; k < 12; k++) px(g, rnd() * 32 | 0, rnd() * 32 | 0, col(0xc4ad88), 1 + (rnd() * 2 | 0), 1);
});
T.timber = tex(32, 32, (g) => {
  for (let y = 0; y < 32; y++) { const b = [0x5b3a24, 0x4c3020, 0x68442a, 0x533522][(y / 8) | 0]; for (let x = 0; x < 32; x++) px(g, x, y, col(b, .9 + rnd() * .16)); }
  for (let y = 7; y < 32; y += 8) for (let x = 0; x < 32; x++) px(g, x, y, col(0x2e1d12));
});
T.roof = tex(32, 32, (g) => {
  noise(g, 0, 0, 32, 32, 0x9a4f38, .05);
  for (let y = 0; y < 32; y += 4) { for (let x = 0; x < 32; x++) px(g, x, y, col(0x7a3828)); px(g, x, y + 1, col(0xb56446, .95)); }
  for (let k = 0; k < 10; k++) px(g, rnd() * 32 | 0, rnd() * 32 | 0, col(0x6a3326), 1 + (rnd() * 3 | 0), 1);
});
T.skyDay = tex(8, 64, (g) => { for (let y = 0; y < 64; y++) { const u = y / 63; const c = u < .55 ? mixHex(0x5c97c4, 0xa9cfdf, u / .55) : mixHex(0xa9cfdf, 0xf4e3b4, (u - .55) / .45); for (let x = 0; x < 8; x++) px(g, x, y, c); } });
T.skyGold = tex(8, 64, (g) => { for (let y = 0; y < 64; y++) { const u = y / 63; const c = u < .55 ? mixHex(0x6a86b5, 0xe8b878, u / .55) : mixHex(0xe8b878, 0xffe0a0, (u - .55) / .45); for (let x = 0; x < 8; x++) px(g, x, y, c); } });
T.skyDusk = tex(8, 64, (g) => { for (let y = 0; y < 64; y++) { const u = y / 63; const c = u < .55 ? mixHex(0x4a4a78, 0xb06a6a, u / .55) : mixHex(0xb06a6a, 0xffb36a, (u - .55) / .45); for (let x = 0; x < 8; x++) px(g, x, y, c); } });
T.skySunset = tex(8, 64, (g) => { for (let y = 0; y < 64; y++) { const u = y / 63; const c = u < .55 ? mixHex(0x2e2a55, 0x8a4a6a, u / .55) : mixHex(0x8a4a6a, 0xff8a4a, (u - .55) / .45); for (let x = 0; x < 8; x++) px(g, x, y, c); } });
T.dust = tex(8, 8, (g) => { for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { const d = Math.hypot(x - 3.5, y - 3.5); if (d < 3.4 && rnd() > d / 4.6) px(g, x, y, `rgba(232,204,150,${(.55 + rnd() * .4).toFixed(2)})`); } });
for (const t of [T.skyDay, T.skyGold, T.skyDusk, T.skySunset]) { t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; }
T.ground.repeat.set(82, 82);
T.dirt.repeat.set(22, 2);
T.plaster.repeat.set(1, 1);
T.timber.repeat.set(1, 1);
T.roof.repeat.set(3, 2);

// ------------------------------------------------------------ materials
const L = (o) => lam(o), B = (o) => basic(o);
const MAT = {
  ground: L({ map: T.ground, color: 0xffffff }),
  dirt: L({ map: T.dirt, color: 0xffffff }),
  plaster: L({ map: T.plaster, color: 0xffffff }),
  timber: L({ map: T.timber, color: 0xffffff }),
  roof: L({ map: T.roof, color: 0xffffff, side: THREE.DoubleSide }),
  window: B({ color: 0xffdca0 }),
  dark: L({ color: 0x22252b }),
  metal: L({ color: 0x4f545a }),
  skin: L({ color: 0xe0b08a }),
  shadow: B({ color: 0x000000, transparent: true, opacity: 0.24, depthWrite: false }),
  khaki: L({ color: 0x8a7a4a }),
  slouch: L({ color: 0x6b5a3a }),
  bark: L({ color: 0x6a4a34 }),
  leaf: L({ color: 0x7f8f5f }),
  straw: L({ color: 0xd8b56a })
};
const matCache = new Map();
const lamC = (c) => { if (!matCache.has(c)) matCache.set(c, L({ color: c })); return matCache.get(c); };

// ------------------------------------------------------------ geometry helpers
function box(parent, w, h, d, mat, x, y, z, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.rotation.set(rx, ry, rz); parent.add(m); return m;
}
function plane(parent, w, h, mat, x, y, z, rx = 0, ry = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z); m.rotation.set(rx, ry, 0); parent.add(m); return m;
}
function cyl(parent, rt, rb, h, seg, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z); parent.add(m); return m;
}
function cone(parent, r, h, seg, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, seg), mat);
  m.position.set(x, y, z); parent.add(m); return m;
}
function gableGeo(w, d, h) {
  const hw = w / 2, hd = d / 2;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([-hw, 0, -hd, hw, 0, -hd, hw, 0, hd, -hw, 0, hd, 0, h, -hd, 0, h, hd], 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 1, 0, 1, 1, 0, 1, .5, .5, .5, .5], 2));
  g.setIndex([0, 1, 4, 1, 5, 4, 1, 2, 5, 2, 3, 5, 3, 0, 4, 3, 4, 5, 0, 3, 2, 0, 2, 1]);
  g.computeVertexNormals(); return g;
}
function gable(parent, w, d, h, mat, x, y, z) {
  const m = new THREE.Mesh(gableGeo(w, d, h), mat); m.position.set(x, y, z); parent.add(m); return m;
}
function bake(root) {
  root.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(root.matrixWorld).invert();
  const byMat = new Map();
  root.traverse((o) => {
    if (!o.isMesh) return;
    let g = o.geometry.clone().applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld));
    if (g.index) g = g.toNonIndexed();
    for (const name of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(name)) g.deleteAttribute(name);
    g.clearGroups();
    if (!byMat.has(o.material.uuid)) byMat.set(o.material.uuid, { mat: o.material, geos: [] });
    byMat.get(o.material.uuid).geos.push(g);
  });
  const out = [];
  for (const { mat, geos } of byMat.values()) {
    const merged = mergeGeometries(geos, false);
    if (merged) out.push(new THREE.Mesh(merged, mat));
    for (const g of geos) g.dispose();
  }
  for (const child of [...root.children]) root.remove(child);
  for (const m of out) root.add(m);
}
// ------------------------------------------------------------ sky, sun, hills, clouds, birds
const skyMats = [];
[T.skyDay, T.skyGold, T.skyDusk, T.skySunset].forEach((tx, i) => {
  const m = new THREE.MeshBasicMaterial({ map: tx, transparent: true, opacity: i === 0 ? 1 : 0, depthWrite: false, depthTest: false, fog: false });
  const p = new THREE.Mesh(new THREE.PlaneGeometry(430, 240), m);
  p.position.set(0, 46, -134); p.renderOrder = -40 + i; scene.add(p); skyMats.push(m);
});
const sunMat = new THREE.MeshBasicMaterial({ color: 0xfff2c0, fog: false, depthWrite: false, depthTest: false });
const sun = new THREE.Mesh(new THREE.CircleGeometry(8, 12), sunMat);
sun.position.set(-24, 26, -126); sun.renderOrder = -35; scene.add(sun);

const hillMats = [];
function ridge(z, color, h, ph, order) {
  const pts = [new THREE.Vector2(-180, -2)];
  for (let x = -180; x <= 180; x += 15) pts.push(new THREE.Vector2(x, h * (0.3 + 0.7 * Math.abs(Math.sin(x * 0.045 + ph)))));
  pts.push(new THREE.Vector2(180, -2));
  const m = new THREE.MeshBasicMaterial({ color, fog: false, depthWrite: false });
  const mesh = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(pts)), m);
  mesh.position.set(0, 0, z); mesh.renderOrder = order; scene.add(mesh); hillMats.push(m);
}
ridge(-92, 0x5f6f55, 13, 0.8, -30);
ridge(-82, 0x7b8a62, 8.5, 2.1, -29);

const cloudMat = new THREE.MeshBasicMaterial({ color: 0xfff4e0, fog: false, transparent: true, opacity: 0.96 });
const clouds = [];
for (let i = 0; i < 6; i++) {
  const g = new THREE.Group();
  const n = 2 + (i % 3);
  for (let k = 0; k < n; k++) {
    const c = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 0), cloudMat);
    c.position.set((k - n / 2) * 2.4 + rnd() * 1.2, rnd() * 1.2, rnd() * 1.4);
    c.scale.set(3.2 + rnd() * 1.8, 1.15 + rnd() * .4, 2.0 + rnd() * .8);
    g.add(c);
  }
  g.position.set(-60 + rnd() * 120, 20 + rnd() * 9, -68 - rnd() * 10);
  g.renderOrder = -20; scene.add(g);
  clouds.push({ g, x0: g.position.x, sp: 0.25 + rnd() * 0.25 });
}
const birds = [];
for (let i = 0; i < 4; i++) {
  const g = new THREE.Group();
  const m = new THREE.MeshBasicMaterial({ color: 0x2b2b2b, fog: false });
  box(g, 0.9, 0.05, 0.16, m, -0.45, 0, 0);
  box(g, 0.9, 0.05, 0.16, m, 0.45, 0, 0);
  g.position.set(-20 + i * 9, 15 + i * 1.3, -38 - i * 3);
  scene.add(g); birds.push({ g, ph: i * 1.7 });
}

// ------------------------------------------------------------ farm world
const world = new THREE.Group(); scene.add(world);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), MAT.ground);
ground.rotation.x = -Math.PI / 2; world.add(ground);

const road = new THREE.Mesh(new THREE.PlaneGeometry(100, 6.5), MAT.dirt);
road.rotation.x = -Math.PI / 2; road.position.set(0, 0.02, 9); world.add(road);

const path = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 24), MAT.dirt);
path.rotation.x = -Math.PI / 2; path.position.set(-11, 0.021, -2); world.add(path);

// fence line, with a gate and a broken stretch
for (let x = -31.5; x <= 31.5; x += 3) {
  const gate = x > -13.4 && x < -8.6;
  const broken = x > -3.6 && x < 0.6;
  if (gate) continue;
  if (broken) {
    const p = box(world, 0.14, 1.05, 0.14, MAT.timber, x, 0.52, -5, 0, 0, (x < -1.5 ? 0.3 : -0.35));
    p.position.y = 0.48;
  } else {
    box(world, 0.14, 1.1, 0.14, MAT.timber, x, 0.55, -5);
    box(world, 3.0, 0.08, 0.08, MAT.timber, x + 1.5, 0.46, -5);
    box(world, 3.0, 0.08, 0.08, MAT.timber, x + 1.5, 0.86, -5);
  }
}
for (const x of [-13.4, -8.6]) box(world, 0.18, 1.35, 0.18, MAT.timber, x, 0.67, -5);
box(world, 3.4, 0.08, 0.08, MAT.timber, -1.6, 0.16, -4.4, 0, 0.2, 0.05);
box(world, 2.6, 0.08, 0.08, MAT.timber, 1.2, 0.14, -4.7, 0, -0.3, -0.04);

// homestead
const house = new THREE.Group(); house.position.set(-14, 0, -18); world.add(house);
box(house, 7, 3.2, 5, MAT.plaster, 0, 1.6, 0);
gable(house, 8, 6, 2, MAT.roof, 0, 3.2, 0);
box(house, 7.4, 0.2, 1.6, MAT.timber, 0, 0.18, 3.1);
box(house, 7.4, 0.16, 1.7, MAT.roof, 0, 2.6, 3.1);
for (const x of [-3.3, -1.1, 1.1, 3.3]) box(house, 0.14, 2.4, 0.14, MAT.timber, x, 1.3, 3.75);
box(house, 0.95, 1.9, 0.1, MAT.timber, 0, 1.0, 2.56);
box(house, 1.15, 0.9, 0.08, MAT.window, -2.2, 1.75, 2.55);
box(house, 1.15, 0.9, 0.08, MAT.window, 2.2, 1.75, 2.55);
box(house, 0.7, 1.6, 0.7, MAT.plaster, -2.4, 4.05, -1.2);
box(house, 0.78, 0.16, 0.78, MAT.dark, -2.4, 4.86, -1.2);
cyl(house, 1.1, 1.1, 2.2, 8, MAT.metal, 4.5, 1.1, 0.2);
for (const [dx, dz] of [[-0.7, -0.7], [0.7, -0.7], [-0.7, 0.7], [0.7, 0.7]]) box(house, 0.1, 1.1, 0.1, MAT.timber, 4.5 + dx, 0.55, 0.2 + dz);

// windmill

function poseEmu(p, t, mode) {
  const ph = p.ph;

    const s = Math.sin(t * 12 + ph);
    p.body.position.y = 1.05 + Math.abs(s) * 0.07;
    p.body.rotation.x = 0.2; p.body.rotation.z = Math.sin(t * 6 + ph) * 0.04;

  } else if (mode === 'walk') {
    const s = Math.sin(t * 5.2 + ph);
    p.body.position.y = 1.05 + Math.abs(s) * 0.035;
    p.body.rotation.x = 0.03; p.body.rotation.z = 0;
    p.legL.rotation.x = s * 0.45; p.legR.rotation.x = -s * 0.45;
    p.neck1.rotation.x = 0.34 + Math.sin(t * 2.1 + ph) * 0.06;
    p.neck2.rotation.x = -0.12 + Math.sin(t * 1.8 + ph) * 0.03;
    p.head.rotation.x = -0.06 + Math.sin(t * 1.7 + ph) * 0.08;
    p.tail.rotation.x = 0.45;
  } else {
    const peck = Math.max(0, Math.sin(t * 0.45 + ph) - 0.88) / 0.12;
    const s = Math.sin(t * 1.5 + ph);
    p.body.position.y = 1.05 + s * 0.012;
    p.body.rotation.x = 0.02; p.body.rotation.z = 0;
    p.legL.rotation.x = 0; p.legR.rotation.x = 0;
    p.neck1.rotation.x = 0.35 + peck * 0.75 + Math.sin(t * 0.9 + ph) * 0.04;
    p.neck2.rotation.x = -0.1 + peck * 0.2;
    p.head.rotation.x = -0.05 + peck * 0.9;
    p.head.rotation.z = Math.sin(t * 0.7 + ph) * 0.12;
    p.tail.rotation.x = 0.45;
  }
}
function updateFlock(t) {
  for (let i = 0; i < flock.length; i++) {
    const p = flock[i];
    let x = p.home.x, z = p.home.z, mode = 'idle';
    if (t < 8.9) {

    } else if (t < 25.6) {

      mode = i % 3 === 0 ? 'walk' : 'idle';

function updateTruck(t) {

  truck.position.set(x, moving ? Math.sin(t * 22) * 0.018 : 0, 7.5);
  for (const w of wheels) w.rotation.z = -x / 0.52;
}
const TV1 = new THREE.Vector3(), TV2 = new THREE.Vector3(), TV3 = new THREE.Vector3();
function setTracer(mesh, from, to) {
  TV1.copy(to).sub(from);
  const len = TV1.length();
  TV2.copy(from).addScaledVector(TV1, 0.5);
  mesh.position.copy(TV2);
  mesh.scale.set(1, len / 4.2, 1);
  TV3.copy(TV1).normalize();
  mesh.quaternion.setFromUnitVectors(V_UP, TV3);
}
function updateGun(t) {
  const firing = t >= 40.55 && t < 44.95;
  const burst = firing && (Math.floor((t - 40.55) * 6) % 2 === 0);
  flash.visible = burst;
  gunBody.position.z = burst ? 0.055 : 0;
  gun.rotation.y = Math.PI + Math.sin(t * 0.6) * 0.05;
  panGround.visible = t > 46.1;
  panGround.rotation.y = t * 1.6;
  if (burst) {
    gun.updateMatrixWorld(true);
    V_A.set(0, 0, 1.3); gunBody.localToWorld(V_A);
    for (let i = 0; i < tracers.length; i++) {
      const tx = 1 + Math.sin(t * 3.1 + i * 2.1) * 6;
      const tz = -7 + Math.cos(t * 2.3 + i * 1.7) * 5;
      V_B.set(tx, 0.15, tz);
      setTracer(tracers[i], V_A, V_B);
      tracers[i].visible = true;
    }
    for (let i = 0; i < impacts.length; i++) {
      const tx = 2 + Math.sin(t * 2.7 + i * 1.9) * 6;
      const tz = -5 + Math.cos(t * 1.9 + i * 2.3) * 6;
      const m = impacts[i];
      const k = (t * 6 + i * 0.27) % 1;
      m.visible = true; m.position.set(tx, 0.12, tz);
      m.scale.setScalar(0.5 + k * 1.7);
      m.material.opacity = 0.65 * (1 - k);
    }
  } else {
    for (const m of tracers) m.visible = false;
    for (const m of impacts) m.visible = false;
  }
}
function updateWheat(t) {
  for (let i = 0; i < WHEAT_N; i++) {
    const d = wheatData[i];
    wheatDummy.position.set(d.x, 0, d.z);
    wheatDummy.rotation.set(0, d.ry, d.tilt + Math.sin(t * 1.7 + d.ph) * 0.05);
    wheatDummy.scale.setScalar(d.s);
    wheatDummy.updateMatrix();
    wheat.setMatrixAt(i, wheatDummy.matrix);
  }
  wheat.instanceMatrix.needsUpdate = true;
}
function updateDust(t) {
  const truckMoving = (t > 26 && t < 30.6) || (t > 64.5 && t < 68.2);
  const chaos = t > 33.4 && t < 51.5;
  for (let i = 0; i < DUST_N; i++) {
    let x, z, y;
    if (truckMoving) {
      x = truck.position.x - 2.4 + Math.sin(t * 4 + i) * 0.7;
      z = 7.5 + (i % 2 ? 1 : -1) * 0.9;
      y = 0.15 + ((t * 1.7 + i * 0.13) % 1) * 0.7;
    } else if (chaos) {
      const e = flock[dustData[i].e];
      x = e.root.position.x + Math.sin(t * 2 + i) * 0.9;
      z = e.root.position.z + Math.cos(t * 1.7 + i) * 0.7;
      y = 0.1 + ((t * 1.4 + i * 0.13) % 1) * 0.8;
    } else {
      x = Math.sin(t * 0.3 + i) * 24;
      z = -8 + Math.cos(t * 0.21 + i * 1.3) * 13;
      y = 0.15 + ((t * 0.5 + i * 0.21) % 1) * 1.1;
    }
    dustPos[i * 3] = x; dustPos[i * 3 + 1] = y; dustPos[i * 3 + 2] = z;
  }
  dustGeo.attributes.position.needsUpdate = true;
}
function updateClouds(t) {
  for (const c of clouds) c.g.position.x = ((c.x0 + t * c.sp + 70) % 140) - 70;
}
function updateBirds(t) {
  for (let i = 0; i < birds.length; i++) {
    const b = birds[i], a = t * 0.12 + b.ph;
    b.g.position.set(Math.sin(a) * 22, 15 + Math.sin(t * 0.5 + i) * 0.8, -36 + Math.cos(a) * 8);
    b.g.rotation.y = -a + Math.PI / 2;
    b.g.children[0].rotation.z = Math.sin(t * 6 + i) * 0.45;
    b.g.children[1].rotation.z = -Math.sin(t * 6 + i) * 0.45;
  }
}

const FOG_COLS = [new THREE.Color(0xf4e3b4), new THREE.Color(0xffd9a0), new THREE.Color(0xff9a6a), new THREE.Color(0xd06a55)];
const SUN_COLS = [new THREE.Color(0xfff2c0), new THREE.Color(0xffd070), new THREE.Color(0xff9a58), new THREE.Color(0xff6a3a)];
const KEY_COLS = [new THREE.Color(0xfff0d0), new THREE.Color(0xffd090), new THREE.Color(0xff9a70), new THREE.Color(0xff7a60)];
const CLOUD_COLS = [new THREE.Color(0xfff4e0), new THREE.Color(0xffe6c0), new THREE.Color(0xffb090), new THREE.Color(0xd08a90)];
const HILL0_COLS = [new THREE.Color(0x5f6f55), new THREE.Color(0x6a6a50), new THREE.Color(0x4a3f4a), new THREE.Color(0x342e44)];
const HILL1_COLS = [new THREE.Color(0x7b8a62), new THREE.Color(0x8a7a52), new THREE.Color(0x6a4a55), new THREE.Color(0x4a3550)];
const C1 = new THREE.Color(), C2 = new THREE.Color(), C3 = new THREE.Color();
function mixColor(arr, w, out) {
  out.setRGB(0, 0, 0);
  for (let i = 0; i < 4; i++) { out.r += arr[i].r * w[i]; out.g += arr[i].g * w[i]; out.b += arr[i].b * w[i]; }
  return out;
}
function updateSky(t) {
  const s1 = smooth(24.8, 27.2, t), s2 = smooth(50.5, 53.0, t), s3 = smooth(66.5, 69.0, t);
  const w = [1 - s1, s1 * (1 - s2), s2 * (1 - s3), s3];
  for (let i = 0; i < 4; i++) skyMats[i].opacity = w[i];
  scene.fog.color.copy(mixColor(FOG_COLS, w, C1));
  scene.background.copy(scene.fog.color);
  sun.position.y = 26 * w[0] + 20 * w[1] + 13 * w[2] + 10 * w[3];
  sunMat.color.copy(mixColor(SUN_COLS, w, C2));
  sun.scale.setScalar(1 + 0.16 * w[3]);
  hillMats[0].color.copy(mixColor(HILL0_COLS, w, C2));
  hillMats[1].color.copy(mixColor(HILL1_COLS, w, C3));
  cloudMat.color.copy(mixColor(CLOUD_COLS, w, C2));
  key.color.copy(mixColor(KEY_COLS, w, C3));
  key.intensity = 1.25 * w[0] + 1.4 * w[1] + 0.95 * w[2] + 0.75 * w[3];
  hemi.intensity = 0.95 * w[0] + 0.8 * w[1] + 0.55 * w[2] + 0.45 * w[3];
  fill.intensity = 0.35 * w[0] + 0.3 * w[1] + 0.25 * w[2] + 0.2 * w[3];
  key.position.set(-14, 16 - 8 * (w[2] + w[3]), 10);
}
// ------------------------------------------------------------ overlays
const capEl = document.getElementById('cap'), tagEl = document.getElementById('tag');
const statEl = document.getElementById('stat'), statKick = document.getElementById('statKick');
const statNum = document.getElementById('statNum'), statLbl = document.getElementById('statLbl');
const titleEl = document.getElementById('title'), titleKick = document.getElementById('titleKick');
const titleH1 = document.getElementById('titleH1'), titleRule = document.getElementById('titleRule');
const titleP = document.getElementById('titleP'), fadeEl = document.getElementById('fade'), shadeEl = document.getElementById('shade');
let lastCap = -1, lastStat = -1;

function updateOverlay(t) {
  let idx = -1;
  for (let i = 0; i < CAPS.length; i++) if (t >= CAPS[i].t0 - 0.12 && t < CAPS[i].t1 + 0.12) idx = i;
  if (idx !== lastCap) {
    capEl.innerHTML = idx >= 0 ? CAPS[idx].text : '';
    if (idx >= 0) {
      const len = CAPS[idx].text.replace(/<br>/g, '').length;
      capEl.style.fontSize = CAPS[idx].size || (len > 44 ? '42px' : len > 34 ? '44px' : '48px');
    }
    lastCap = idx;
  }
  if (idx >= 0) {
    const c = CAPS[idx];
    const a = smooth(c.t0 - 0.08, c.t0 + 0.12, t) * (1 - smooth(c.t1 - 0.12, c.t1 + 0.04, t));
    capEl.style.opacity = a.toFixed(3);
    capEl.style.visibility = a > 0.01 ? 'visible' : 'hidden';
  } else {
    capEl.style.opacity = '0'; capEl.style.visibility = 'hidden';
  }

  const tagA = smooth(0.35, 0.8, t) * (1 - smooth(5.0, 5.45, t));
  tagEl.style.opacity = tagA.toFixed(3);

  const statOn = t >= 56.05 && t < 60.15;
  if (statOn) {
    const second = t >= 58.25;
    const mode = second ? 1 : 0;
    if (mode !== lastStat) {
      statKick.textContent = second ? 'AMUNISI' : 'OPERATION 1';
      statNum.textContent = second ? '10,000' : '30';
      statLbl.textContent = second ? 'ROUNDS' : 'EMUS';
      lastStat = mode;
    }
    const a = smooth(56.05, 56.4, t) * (1 - smooth(59.9, 60.15, t));
    statEl.style.opacity = a.toFixed(3);
    statEl.style.visibility = a > 0.01 ? 'visible' : 'hidden';
    const pop = second ? 1 + 0.05 * (1 - smooth(58.25, 58.62, t)) : 1;
    statEl.style.transform = `scale(${pop.toFixed(3)})`;
  } else {
    statEl.style.opacity = '0'; statEl.style.visibility = 'hidden'; lastStat = -1;
  }

  const titleOn = t >= 68.25;
  shadeEl.style.opacity = titleOn ? (smooth(68.25, 69.2, t) * 0.95).toFixed(3) : '0';
  titleEl.style.opacity = titleOn ? '1' : '0';
  titleEl.style.visibility = titleOn ? 'visible' : 'hidden';
  if (titleOn) {
    titleKick.style.opacity = smooth(68.25, 69.2, t).toFixed(3);
    const h = smooth(70.85, 71.6, t);
    titleH1.style.opacity = h.toFixed(3);
    titleH1.style.transform = `translateY(${((1 - h) * 26).toFixed(1)}px)`;
    titleRule.style.opacity = h.toFixed(3);
    titleP.style.opacity = smooth(73.1, 73.9, t).toFixed(3);
  }

  const blackStart = 1 - smooth(0.0, 0.55, t);
  const blackEnd = smooth(78.8, 79.85, t);
  fadeEl.style.opacity = Math.max(blackStart, blackEnd).toFixed(3);
}

// ------------------------------------------------------------ main render
const camPos = new THREE.Vector3(), camA = new THREE.Vector3(), camB = new THREE.Vector3(), look = new THREE.Vector3();
function updateCamera(t) {
  let s = SHOTS[SHOTS.length - 1];
  for (const q of SHOTS) if (t >= q.t0 && t < q.t1) { s = q; break; }
  const k = smooth(s.t0, s.t1, t);
  camA.set(s.p0[0], s.p0[1], s.p0[2]); camB.set(s.p1[0], s.p1[1], s.p1[2]);
  camPos.lerpVectors(camA, camB, k);
  const shk = s.shake || 0;
  camPos.x += (Math.sin(t * 13.7) + Math.sin(t * 7.3) * 0.6) * 0.02 * shk;
  camPos.y += (Math.sin(t * 11.1) + Math.sin(t * 5.9) * 0.5) * 0.016 * shk;
  camera.position.copy(camPos);
  look.set(lerp(s.look0[0], s.look1[0], k), lerp(s.look0[1], s.look1[1], k), lerp(s.look0[2], s.look1[2], k));
  look.x += Math.sin(t * 9.1) * 0.015 * shk;
  look.y += Math.sin(t * 7.7) * 0.01 * shk;
  camera.lookAt(look);
  camera.fov = lerp(s.fov0, s.fov1, k);
  camera.updateProjectionMatrix();
}

function renderAt(t) {
  updateCamera(t);
  updateSky(t);
  updateFlock(t);
  updateHero(t);
  updateFarmers(t);
  updateSoldiers(t);
  updateTruck(t);
  updateGun(t);
  updateWheat(t);
  updateDust(t);
  updateClouds(t);
  updateBirds(t);
  windFan.rotation.z = t * 1.35;
  updateOverlay(t);
  renderer.render(scene, camera);
}
window.addEventListener('hf-seek', (e) => renderAt(e.detail.time));
renderAt(window.__hfThreeTime || 0);
</script>
