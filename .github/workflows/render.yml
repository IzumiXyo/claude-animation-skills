name: Render animation

on:
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill (quick skills: graph, map-route, breakdown, dan-koe, kurzgesagt, low-poly, minecraft, minimalistic-graphics)"
        required: true
        type: choice
        default: graph
        options:
          - graph
          - map-route
          - breakdown
          - dan-koe
          - kurzgesagt
          - low-poly
          - minecraft
          - minimalistic-graphics
      spec:
        description: "Spec JSON (one object, same fields as the skill's SKILL.md)"
        required: true
        type: string
      name:
        description: "Output file name (without extension)"
        required: false
        default: render
        type: string
      project:
        description: "Optional project under projects/ (overrides skill), e.g. dancing-plague-lowpoly"
        required: false
        default: ""
        type: string
      snap:
        description: "Optional snapshot times (comma-separated) instead of a full render"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kit/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install kit dependencies
        run: |
          cd kit
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund --no-save --onnxruntime-node-install-cuda=skip hyperframes@0.8.34
          mkdir -p vendor
          if [ ! -s vendor/gsap.min.js ]; then
            curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js -o vendor/gsap.min.js
          fi

      - name: Cache HyperFrames browser
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hyperframes
            ~/.cache/puppeteer
          key: hyperframes-0.8.34-${{ runner.os }}

      - name: Write spec
        env:
          SPEC: ${{ inputs.spec }}
          NAME: ${{ inputs.name }}
        run: |
          mkdir -p jobs
          python3 - <<'PY'
          import json, os, re

          raw = os.environ["SPEC"]
          spec = json.loads(raw)
          name = re.sub(r"[^A-Za-z0-9._-]+", "-", os.environ.get("NAME") or "render").strip("-") or "render"
          spec["out"] = f"out/{name}.mp4"
          with open("jobs/spec.json", "w", encoding="utf-8") as f:
              json.dump(spec, f, ensure_ascii=False, indent=2)
          print(json.dumps(spec, ensure_ascii=False, indent=2))
          PY

      - name: Render
        env:
          SKILL: ${{ inputs.skill }}
          PROJECT: ${{ inputs.project }}
          SNAP: ${{ inputs.snap }}
        run: |
          set -euo pipefail
          if [ -n "$PROJECT" ]; then
            CMD=(python3 "projects/$PROJECT/build.py" jobs/spec.json)
          else
            CMD=(python3 "skills/$SKILL/build.py" jobs/spec.json)
          fi
          if [ -n "$SNAP" ]; then CMD+=(--snap "$SNAP"); fi
          echo "running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Upload video and contact sheet
        if: ${{ inputs.snap == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: animation-${{ github.run_number }}
          path: |
            jobs/out/*.mp4
            jobs/out/*.sheet.jpg
          if-no-files-found: error

      - name: Upload snapshots
        if: ${{ inputs.snap != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ github.run_number }}
          path: jobs/out/*.snaps/*.png
          if-no-files-found: error
